version: '3.8'

# ============================================
# GraphRAG Docker Compose 配置
# 包含: Neo4j + Milvus (etcd/minio/standalone) + RAG应用
# ============================================

services:
  # ==========================================
  # Neo4j 图数据库
  # ==========================================
  neo4j:
    container_name: graphrag-neo4j
    image: ${REGISTRY_MIRROR:-}neo4j:5.15.0
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-graphrag123}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/neo4j/data:/data
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/neo4j/logs:/logs
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/neo4j/import:/var/lib/neo4j/import
      - ./neo4j_data:/var/lib/neo4j/import/init_data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - graphrag-network

  # Neo4j 数据初始化服务（一次性运行）
  neo4j-init:
    container_name: graphrag-neo4j-init
    image: ${REGISTRY_MIRROR:-}neo4j:5.15.0
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - NEO4J_URI=neo4j://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-graphrag123}
    volumes:
      - ./neo4j_data:/init_data:ro
    entrypoint: >
      /bin/bash -c "
        echo '等待 Neo4j 完全就绪...'
        sleep 10
        echo '检查数据是否已导入...'
        RESULT=$$(cypher-shell -a neo4j://neo4j:7687 -u neo4j -p $${NEO4J_PASSWORD:-graphrag123} 'MATCH (n) RETURN count(n) as count' 2>/dev/null | tail -1)
        if [ \"$$RESULT\" != \"0\" ] && [ -n \"$$RESULT\" ]; then
          echo '数据已存在，跳过导入'
        else
          echo '开始导入数据...'
          cypher-shell -a neo4j://neo4j:7687 -u neo4j -p $${NEO4J_PASSWORD:-graphrag123} -f /init_data/import_data.cypher
          echo '数据导入完成！'
        fi
      "
    networks:
      - graphrag-network

  # ==========================================
  # Milvus 向量数据库依赖服务
  # ==========================================
  etcd:
    container_name: graphrag-etcd
    image: ${REGISTRY_MIRROR:-}quay.io/coreos/etcd:v3.5.16
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - graphrag-network

  minio:
    container_name: graphrag-minio
    image: ${REGISTRY_MIRROR:-}minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"  # Console
      - "9000:9000"  # API
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - graphrag-network

  # ==========================================
  # Milvus 向量数据库（Standalone 模式）
  # ==========================================
  milvus:
    container_name: graphrag-milvus
    image: ${REGISTRY_MIRROR:-}milvusdb/milvus:v2.5.14
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"  # gRPC
      - "9091:9091"    # Metrics
    depends_on:
      - etcd
      - minio
    networks:
      - graphrag-network

  # ==========================================
  # GraphRAG 应用服务
  # ==========================================
  graphrag:
    container_name: graphrag-app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REGISTRY_MIRROR: ${REGISTRY_MIRROR:-}
    environment:
      # Neo4j 配置
      - NEO4J_URI=neo4j://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-graphrag123}
      - NEO4J_DATABASE=neo4j
      # Milvus 配置
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - MILVUS_COLLECTION_NAME=${MILVUS_COLLECTION_NAME:-travel_knowledge}
      # LLM 配置（从 .env 文件读取）
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com/v1}
      # Embedding 配置
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      # 其他配置
      - TOP_K=${TOP_K:-5}
      - TEMPERATURE=${TEMPERATURE:-0.1}
      - MAX_TOKENS=${MAX_TOKENS:-2048}
      - CHUNK_SIZE=${CHUNK_SIZE:-500}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-50}
      - MAX_GRAPH_DEPTH=${MAX_GRAPH_DEPTH:-2}
    volumes:
      # 挂载模型缓存（避免每次重新下载）
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/huggingface:/root/.cache/huggingface
    depends_on:
      neo4j:
        condition: service_healthy
      milvus:
        condition: service_healthy
    stdin_open: true   # 支持交互式输入
    tty: true          # 分配伪终端
    networks:
      - graphrag-network

networks:
  graphrag-network:
    name: graphrag-network
    driver: bridge
